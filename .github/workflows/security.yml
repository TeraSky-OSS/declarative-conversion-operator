name: Security

# Everything that answers "is what we ship actually safe", separated from CI
# so that a scanner outage or a newly-published advisory does not block an
# unrelated pull request from merging — while still failing loudly on the
# default branch and on a schedule.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 05:00 UTC. New advisories land continuously; a scan
    # that only runs on pushes goes stale on a quiet week.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # These jobs go on to run downloaded code (govulncheck, CodeQL
          # autobuild, kind, helm plugins). checkout persists the job token
          # in .git/config by default, where that code can read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The highest-signal, lowest-noise scanner for a Go project: it
      # reports a vulnerability only when the vulnerable symbol is actually
      # reachable from this module's code, so a CVE in an unused corner of a
      # transitive dependency does not fail the build.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # These jobs go on to run downloaded code (govulncheck, CodeQL
          # autobuild, kind, helm plugins). checkout persists the job token
          # in .git/config by default, where that code can read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:go

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # A pull request from a fork cannot be granted id-token, and Scorecard
    # needs the default branch's settings anyway — branch protection and
    # token permissions are repository properties, not properties of a diff.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write # publish the signed result so the badge can be trusted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
