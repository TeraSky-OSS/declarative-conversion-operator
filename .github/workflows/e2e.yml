name: E2E

on:
  push:
    branches: [main]
  # Any PR base (including stacked phase-* branches), not only main.
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The package-managed leg installs the chart three times (guard on, guard
    # off, guard back on) on top of the shared kind + cert-manager +
    # Crossplane setup, so 20 minutes no longer leaves useful headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kind + Crossplane + cert-manager, both features enabled
            script: hack/e2e-test.sh
          - name: kind + cert-manager, native CRD only (no Crossplane installed)
            script: hack/e2e-test-crd-only.sh
          - name: kind + Crossplane + cert-manager, Crossplane only (native CRD disabled)
            script: hack/e2e-test-crossplane-only.sh
          - name: kind + Crossplane + cert-manager, scope LegacyCluster with claims
            script: hack/e2e-test-legacy-claims.sh
          - name: kind + Crossplane + cert-manager, package-managed XRD conversion guard
            script: hack/e2e-test-package-managed.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kind
        run: |
          sudo curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          sudo chmod +x /usr/local/bin/kind

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -sSL https://dl.k8s.io/release/stable.txt)"
          sudo curl -Lo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run e2e test
        run: ./${{ matrix.script }}
