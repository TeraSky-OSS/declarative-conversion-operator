name: CI

on:
  push:
    branches: [main]
  # Any PR base (including stacked phase-* branches), not only main.
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes via git; they all run
          # repository-controlled code (go test, benchmarks, linters, docker
          # build, kind). checkout persists the job token in .git/config by
          # default, where that code can read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result."
            git diff go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race, coverage)
        # -coverpkg=./... attributes coverage to the package a statement
        # actually lives in, even when it's only ever exercised by a test in
        # a *different* package (e.g. api/v1alpha1's rule-conversion logic,
        # called from internal/webhook and internal/cli's tests). Without
        # it, go test's default same-package-only accounting understates
        # real coverage for exactly that kind of library code.
        run: go test ./... -race -count=1 -coverpkg=./... -coverprofile=coverage.out

      - name: Enforce minimum coverage
        run: |
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')"
          echo "Total coverage: ${total}%"
          # 60% leaves headroom below the ~65% this suite currently
          # achieves, so incidental drift doesn't fail CI, while still
          # catching a real regression (e.g. a large chunk of untested code
          # landing, or tests being deleted rather than fixed).
          threshold=60
          if awk -v t="$total" -v m="$threshold" 'BEGIN { exit !(t < m) }'; then
            echo "Coverage ${total}% is below the ${threshold}% minimum."
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  bench:
    name: Microbenchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes via git; they all run
          # repository-controlled code (go test, benchmarks, linters, docker
          # build, kind). checkout persists the job token in .git/config by
          # default, where that code can read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -bench (does not assert absolute times)
        run: make bench

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes via git; they all run
          # repository-controlled code (go test, benchmarks, linters, docker
          # build, kind). checkout persists the job token in .git/config by
          # default, where that code can read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Reads .golangci.yml from the repository root. The version here,
      # GOLANGCI_LINT_VERSION in the Makefile, and the `version:` key in
      # .golangci.yml are one set — a config written against a different
      # schema version fails the run outright, so `make lint` locally and
      # this job have to be the same tool.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  cli-smoke-test:
    name: convctl offline smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes via git; they all run
          # repository-controlled code (go test, benchmarks, linters, docker
          # build, kind). checkout persists the job token in .git/config by
          # default, where that code can read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run convctl against the bundled fixtures
        run: |
          go run ./cmd/convctl test \
            --xrd internal/cli/testdata/xrd.yaml \
            --config internal/cli/testdata/config.yaml \
            --samples internal/cli/testdata/samples

      - name: Run convctl against the full-coverage fixture (3 versions, all strategies)
        run: |
          go run ./cmd/convctl test \
            --xrd internal/cli/testdata/full/xrd.yaml \
            --config internal/cli/testdata/full/config.yaml \
            --samples internal/cli/testdata/full/samples

  kustomize:
    name: Validate kustomize manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes via git; they all run
          # repository-controlled code (go test, benchmarks, linters, docker
          # build, kind). checkout persists the job token in .git/config by
          # default, where that code can read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: kustomize build config/default
        run: go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.1 build config/default > /dev/null

  helm:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This job installs and runs the helm-unittest plugin, which is
          # downloaded code. checkout persists the job token in .git/config by
          # default, where that code could read it.
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: helm lint
        run: helm lint charts/declarative-conversion-operator

      - name: helm template (default values)
        run: helm template declarative-conversion-operator charts/declarative-conversion-operator --namespace declarative-conversion-system

      - name: helm template (autoscaling + monitoring + dashboards enabled)
        run: |
          helm template declarative-conversion-operator charts/declarative-conversion-operator --namespace declarative-conversion-system \
            --set conversionWebhookServer.autoscaling.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set dashboards.enabled=true \
            --set manager.podDisruptionBudget.enabled=true

      # The assertions that used to live here as `helm template | grep -q`
      # are now helm-unittest suites in charts/*/tests/. grep proves that a
      # string is present somewhere in the rendered stream; it cannot say
      # which object the key is on, and it cannot say that something is
      # ABSENT — so a template that rendered when it should not have used to
      # pass unnoticed. The `helm install`-time value validation they
      # partially stood in for is now values.schema.json.
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.2

      - name: helm unittest
        run: helm unittest charts/declarative-conversion-operator

      - name: helm template (the install-UX fixture, against values.schema.json)
        run: |
          helm template declarative-conversion-operator charts/declarative-conversion-operator \
            --namespace declarative-conversion-system \
            -f hack/testdata/helm-install-ux-values.yaml >/dev/null

      - name: values.schema.json rejects what the binaries would refuse
        run: |
          # Each of these would otherwise reach a container flag and be
          # rejected at startup, i.e. arrive as a crash loop rather than as an
          # error naming the value.
          for bad in \
            conversionWebhookServer.replicaCount2=3 \
            conversionWebhookServer.maxRequestBytes=banana \
            conversionWebhookServer.maxRequestBytes=0 \
            conversionWebhookServer.requestTimeout=0s \
            conversionWebhookServer.rollout.maxSurge=-1 \
            metrics.serviceMonitor.interval=0s
          do
            if helm template declarative-conversion-operator charts/declarative-conversion-operator \
              --namespace declarative-conversion-system --set "$bad" >/dev/null 2>&1; then
              echo "FAIL: '$bad' was accepted; values.schema.json is not being enforced" >&2
              exit 1
            fi
            echo "rejected: $bad"
          done

      - name: CRD upgrade helper prints chart CRDs
        run: |
          out="$(./hack/upgrade-crds.sh --chart charts/declarative-conversion-operator --print)"
          case "$out" in
            *"kind: CustomResourceDefinition"*) ;;
            *)
              echo "FAIL: upgrade-crds --print did not emit a CustomResourceDefinition" >&2
              exit 1
              ;;
          esac
          for name in \
            conversionwebhookservers.terasky.com \
            crdconversionconfigs.terasky.com \
            xrdconversionconfigs.terasky.com
          do
            case "$out" in
              *"name: ${name}"*) ;;
              *)
                echo "FAIL: upgrade-crds --print missing CRD name ${name}" >&2
                exit 1
                ;;
            esac
          done

      - name: promtool test rules
        run: make test-prometheus

  docker-build-check:
    name: Docker build check (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [manager, webhook-server, convctl]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes via git; they all run
          # repository-controlled code (go test, benchmarks, linters, docker
          # build, kind). checkout persists the job token in .git/config by
          # default, where that code can read it.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            COMPONENT=${{ matrix.component }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
