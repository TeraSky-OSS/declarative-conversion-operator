# The Actions this repository publishes are its public CI surface. An Action
# nobody tests is a broken Action nobody notices until a consumer's pipeline
# goes red — and by then the breakage is in a published tag that other
# repositories are pinned to.
name: Actions

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/actions-test.yml"
      - "test/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/actions-test.yml"
      - "test/actions/**"

permissions:
  contents: read

concurrency:
  group: actions-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks first: they are seconds, and they catch the whole class of
  # "the action.yml is malformed" without spending a runner minute per OS.
  static:
    name: actionlint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Over the whole repository, not just the new files: a workflow that
      # broke two years ago is still broken.
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

      # actionlint treats a composite action's action.yml as a malformed
      # workflow, so the Actions themselves need their own checks.
      - name: Static checks on the composite Actions
        run: go test ./test/actions/ -v

      # And their shell, which is most of the shell in this repository and
      # which actionlint's shellcheck pass never reaches.
      - name: Shellcheck the composite Actions
        run: hack/shellcheck-actions.sh

      # Nothing else resolves a `uses:`. A reference to a tag that does not
      # exist passes every other check here and fails at run time with an
      # error about the reference rather than about the thing it installs.
      - name: Every action reference resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/check-action-pins.sh

  setup:
    name: setup-convctl (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # By local path, so the version under test is this pull request's
      # version rather than whatever is published.
      - name: Install latest
        id: latest
        uses: ./.github/actions/setup-convctl

      - name: It resolved a concrete tag and works
        shell: bash
        env:
          RESOLVED: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$RESOLVED"
          case "$RESOLVED" in
            v*) ;;
            *) echo "resolved version is not a tag: $RESOLVED" >&2; exit 1 ;;
          esac
          # Only commands the oldest supported release has: this job
          # deliberately installs a published binary, so asserting on a
          # feature added in the pull request would test the release rather
          # than the Action.
          convctl version
          convctl validate --help >/dev/null

  # The `binary` input had no coverage at all, and shipped broken: the step
  # chmod'd the symlink it had just created, chmod dereferenced to the
  # target, and the whole job died with "Operation not permitted" whenever
  # that target was not owned by the job's user. Root ownership is not an
  # edge case for this input — a binary vendored into a container image and
  # copied in by an init container is the normal self-hosted-runner setup,
  # which is exactly what `binary` exists to serve.
  supplied-binary:
    name: setup-convctl accepts a root-owned supplied binary
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Owned by root, mode 0755, outside the workspace — the shape an
      # init container leaves behind.
      - name: Vendor a root-owned convctl
        run: |
          set -euo pipefail
          go build -o /tmp/convctl ./cmd/convctl
          sudo install -d -o root -g root -m 0755 /opt/convctl
          sudo install -o root -g root -m 0755 /tmp/convctl /opt/convctl/convctl
          test "$(stat -c '%U' /opt/convctl/convctl)" = root

      - name: Install from the supplied binary
        id: supplied
        uses: ./.github/actions/setup-convctl
        with:
          binary: /opt/convctl/convctl

      - name: It is on PATH as `convctl` and reports a version
        run: |
          set -euo pipefail
          test -n "${{ steps.supplied.outputs.version }}"
          command -v convctl
          convctl version

  # actions/cache saves in the job's post step, so a second install inside
  # one job can never hit it. The cached path is a LATER job or run — which
  # is also the one that runs in practice, and the one that silently rots.
  cache:
    name: setup-convctl uses the cache and still verifies
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install, expecting the cache populated by the matrix job
        id: cached
        uses: ./.github/actions/setup-convctl

      - name: It was a cache hit, and it verified anyway
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cached.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::not a cache hit, so the cached path is still untested" >&2
            exit 1
          fi
          convctl version

  # The most important job here. A verification step that cannot be shown to
  # fail is not a verification step.
  tamper:
    name: setup-convctl rejects a tampered archive
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install once, so a real archive is on disk to corrupt
        id: real
        uses: ./.github/actions/setup-convctl
        with:
          cache: "false"

      - name: Corrupt the downloaded archive
        shell: bash
        env:
          VERSION: ${{ steps.real.outputs.version }}
        run: |
          set -euo pipefail
          bare="${VERSION#v}"
          dir="$RUNNER_TEMP/convctl-$bare"
          archive="$(find "$dir" -name '*.tar.gz' | head -1)"
          test -n "$archive"
          # Same size, different bytes: a length check would not catch this,
          # which is the point of checking the hash. The second install
          # keeps the archive that is already there, so the corruption
          # survives to be verified rather than being repaired by a fresh
          # download.
          printf 'tampered' | dd of="$archive" bs=1 seek=0 conv=notrunc status=none
          echo "corrupted $archive"

      # cache: false, so a warm cache cannot restore the good archive over
      # the corrupted one — which would leave this job green while testing
      # nothing at all, the exact failure it exists to prevent one level up.
      - name: Verification must reject it
        id: tampered
        continue-on-error: true
        uses: ./.github/actions/setup-convctl
        with:
          version: ${{ steps.real.outputs.version }}
          cache: "false"

      - name: Assert the step failed
        shell: bash
        env:
          OUTCOME: ${{ steps.tampered.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::setup-convctl accepted a tampered archive (outcome: $OUTCOME)" >&2
            echo "A verification step that cannot be shown to fail is not a verification step." >&2
            exit 1
          fi
          echo "tampered archive was rejected, as it must be"

  test-action:
    name: convctl-test against fixtures
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Actions are exercised against the build under review, not against
      # the last release. Otherwise every fixture here would be limited to
      # features that already shipped — which is the opposite of what a pull
      # request needs to prove.
      # On PATH, exactly as setup-convctl would leave it — the Actions
      # under test consume convctl from PATH rather than installing it.
      - name: Build the convctl under test and put it on PATH
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/convctl" ./cmd/convctl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # A clean fixture passes and still produces a report.
      - name: Clean fixture
        id: clean
        uses: ./.github/actions/convctl-test
        with:
          config: internal/cli/testdata/full/config.yaml
          xrd: internal/cli/testdata/full/xrd.yaml
          samples: internal/cli/testdata/full/samples
          artifact-name: actions-test-clean

      # Outputs go through env rather than being interpolated into the
      # script: an output the Action never set would otherwise expand to
      # nothing and make `[ "" -lt 1 ]` a bash error rather than a failed
      # assertion, which reads as a broken test instead of a broken Action.
      - name: It passed and reported real numbers
        shell: bash
        env:
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
          PASSED: ${{ steps.clean.outputs.pass }}
          REPORT: ${{ steps.clean.outputs.report-path }}
        run: |
          set -euo pipefail
          if [ "$EXIT_CODE" != "0" ]; then
            echo "a clean fixture did not pass" >&2; exit 1
          fi
          if [ "${PASSED:-0}" -lt 1 ]; then
            echo "the pass count is '${PASSED:-}'; the Action exited correctly while reporting nothing" >&2
            exit 1
          fi
          test -f "$REPORT"

      # A deliberately broken fixture must fail AND say where. Asserting on
      # the annotation payload rather than only the exit code: every one of
      # these Actions can exit correctly while rendering nothing.
      #
      # The fixture converts to values the destination schema rejects — an
      # out-of-enum value and a pattern violation — which compiles cleanly
      # and fails only at --validate-output, so it takes the path a real
      # regression takes rather than failing at analysis.
      - name: Capture the annotations for a failing fixture
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go run ./cmd/convctl test \
            --xrd internal/cli/testdata/validate-output/xrd.yaml \
            --config internal/cli/testdata/validate-output/config.yaml \
            --samples internal/cli/testdata/validate-output/samples \
            --validate-output --output github --quiet > annotations.txt 2>&1
          code=$?
          set -e
          cat annotations.txt
          if [ "$code" -eq 0 ]; then
            echo "::error::the failing fixture passed; it is no longer a failing fixture" >&2
            exit 1
          fi

      - name: The annotation carries the config file, a line, and the rule
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^::error ' annotations.txt; then
            echo "::error::no error annotations were emitted for a failing run" >&2
            cat annotations.txt >&2
            exit 1
          fi
          if ! grep -qE '^::error file=[^,]*validate-output/config\.yaml,line=[0-9]+' annotations.txt; then
            echo "::error::annotations do not carry the config file and a line number" >&2
            cat annotations.txt >&2
            exit 1
          fi
          # Naming the rule is what makes an annotation actionable rather
          # than merely located.
          if ! grep -qE 'rule\[[0-9]+\]' annotations.txt; then
            echo "::error::annotations do not name the rule that produced the finding" >&2
            cat annotations.txt >&2
            exit 1
          fi
          echo "annotations land on the config, with line numbers and the rule"

      - name: The Action itself fails on that fixture
        id: failing
        continue-on-error: true
        uses: ./.github/actions/convctl-test
        with:
          config: internal/cli/testdata/validate-output/config.yaml
          xrd: internal/cli/testdata/validate-output/xrd.yaml
          samples: internal/cli/testdata/validate-output/samples
          validate-output: "true"
          artifact-name: actions-test-failing

      - name: Assert it failed, and reported why
        shell: bash
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          ERRORS: ${{ steps.failing.outputs.errors }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::a fixture that produces schema violations did not fail the Action" >&2
            exit 1
          fi
          if [ "${ERRORS:-0}" -lt 1 ]; then
            echo "::error::the Action failed but reported no errors, so its summary would read as a mystery" >&2
            exit 1
          fi

      - name: annotate:false and upload-artifact:false both work
        id: quiet
        uses: ./.github/actions/convctl-test
        with:
          config: internal/cli/testdata/full/config.yaml
          xrd: internal/cli/testdata/full/xrd.yaml
          samples: internal/cli/testdata/full/samples
          annotate: "false"
          upload-artifact: "false"

      - name: It still ran
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quiet.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = "0"

  diff-action:
    name: convctl-diff renders a delta
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # On PATH, exactly as setup-convctl would leave it — the Actions
      # under test consume convctl from PATH rather than installing it.
      - name: Build the convctl under test and put it on PATH
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/convctl" ./cmd/convctl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # comment:false — this job proves the rendering and the exit-code
      # semantics; commenting needs a pull request and a writable token.
      - name: Two configs that differ
        id: diff
        uses: ./.github/actions/convctl-diff
        with:
          # Two configs for the SAME hub that differ in one rule. The
          # mistakes/ fixtures cannot be used here: they target a different
          # hub, so the comparison fails to analyze and exits 2 — which the
          # Action correctly treats as "could not run" rather than as a
          # delta, and which therefore tests the error path rather than the
          # rendering this job is about.
          config: |
            internal/cli/testdata/config.yaml
            internal/cli/testdata/config-norename.yaml
          xrd: internal/cli/testdata/xrd.yaml
          comment: "false"

      - name: A delta was found and did not fail the job
        shell: bash
        env:
          HAS_DELTAS: ${{ steps.diff.outputs.has-deltas }}
          EXIT_CODE: ${{ steps.diff.outputs.exit-code }}
          MARKDOWN: ${{ steps.diff.outputs.markdown-path }}
        run: |
          set -euo pipefail
          if [ "$HAS_DELTAS" != "true" ]; then
            echo "two different configs produced no delta" >&2; exit 1
          fi
          if [ "$EXIT_CODE" != "1" ]; then
            echo "expected exit 1 for deltas, got '$EXIT_CODE'" >&2; exit 1
          fi
          # The rendering is the product; an empty one is a silent failure.
          test -s "$MARKDOWN"
          grep -q '^### Conversion config diff' "$MARKDOWN"
          echo "delta rendered, job stayed green"

      - name: Identical configs report no deltas
        id: same
        uses: ./.github/actions/convctl-diff
        with:
          config: |
            examples/field-rename/xrdconversionconfig.yaml
            examples/field-rename/xrdconversionconfig.yaml
          xrd: examples/field-rename/xrd.yaml
          comment: "false"

      - name: And say so rather than rendering nothing
        shell: bash
        env:
          HAS_DELTAS: ${{ steps.same.outputs.has-deltas }}
          MARKDOWN: ${{ steps.same.outputs.markdown-path }}
        run: |
          set -euo pipefail
          test "$HAS_DELTAS" = "false"
          grep -q 'No differences' "$MARKDOWN"
