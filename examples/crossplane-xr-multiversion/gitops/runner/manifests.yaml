# In-cluster self-hosted GitHub Actions runner for the live GitOps demo.
# Token secret and entrypoint ConfigMap are created by gitops/lib.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: actions-runner
  labels:
    app.kubernetes.io/name: xwidget-demo-runner
    app.kubernetes.io/part-of: declarative-conversion-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xwidget-demo-runner
  namespace: actions-runner
---
# convctl test --live lists the XRD, conversion config, and live XRs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xwidget-demo-runner
  labels:
    app.kubernetes.io/name: xwidget-demo-runner
    app.kubernetes.io/part-of: declarative-conversion-operator
rules:
  - apiGroups: [apiextensions.crossplane.io]
    resources: [compositeresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [terasky.com]
    resources: [xrdconversionconfigs]
    verbs: [get, list]
  - apiGroups: [example.org]
    resources: [xwidgets]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xwidget-demo-runner
  labels:
    app.kubernetes.io/name: xwidget-demo-runner
    app.kubernetes.io/part-of: declarative-conversion-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xwidget-demo-runner
subjects:
  - kind: ServiceAccount
    name: xwidget-demo-runner
    namespace: actions-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xwidget-demo-runner
  namespace: actions-runner
  labels:
    app.kubernetes.io/name: xwidget-demo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: xwidget-demo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xwidget-demo-runner
    spec:
      serviceAccountName: xwidget-demo-runner
      initContainers:
        - name: copy-convctl
          image: xwidget-demo-convctl:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "cp /convctl /opt/convctl/convctl && chmod 0755 /opt/convctl/convctl"]
          volumeMounts:
            - name: convctl
              mountPath: /opt/convctl
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.336.0
          imagePullPolicy: IfNotPresent
          command: ["/runner-entrypoint.sh"]
          env:
            - name: GH_REPO
              valueFrom:
                secretKeyRef:
                  name: runner-auth
                  key: repo
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runner-auth
                  key: token
            - name: RUNNER_NAME
              valueFrom:
                secretKeyRef:
                  name: runner-auth
                  key: name
            - name: RUNNER_LABELS
              value: xwidget-demo
            - name: HOME
              value: /home/runner
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: convctl
              mountPath: /opt/convctl
            - name: entrypoint
              mountPath: /runner-entrypoint.sh
              subPath: entrypoint.sh
            - name: work
              mountPath: /home/runner/_work
      volumes:
        - name: convctl
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: entrypoint
          configMap:
            name: runner-entrypoint
            defaultMode: 0755
