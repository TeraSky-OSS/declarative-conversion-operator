# Generated by convctl generate kyverno. Review before apply. convctl never applies this.
# First document only (Composition labeler). The migrate document is applied at hub promote.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: label-compositions-xwidgets
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apiextensions.crossplane.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - compositions
  mutations:
  - applyConfiguration:
      expression: |-
        (
          has(object.spec.compositeTypeRef) && has(object.spec.compositeTypeRef.kind) && object.spec.compositeTypeRef.kind == "XWidget" && has(object.spec.compositeTypeRef.apiVersion) && object.spec.compositeTypeRef.apiVersion.startsWith("example.org/")
          ?
            Object{
              metadata: Object.metadata{
                labels: {
                  "xrd-api-version": object.spec.compositeTypeRef.apiVersion.split("/")[1]
                }
              }
            }
          :
            Object{}
        )
    patchType: ApplyConfiguration
