# INTENTIONALLY WRONG — XRD has already set served: false on v1, but this
# config still lists v1 as a spoke. Admission/validate reject it
# (spoke version "v1" is not served). Drop the spoke first, then un-serve.
apiVersion: terasky.com/v1alpha1
kind: XRDConversionConfig
metadata:
  name: xwidgets-conversion
spec:
  targetXRD:
    name: xwidgets.example.org
  hubVersion: v3
  spokes:
    - version: v2
      rules:
        - strategy: FieldRename
          fieldRename:
            hubPath: spec.name
            spokePath: spec.widgetName
    - version: v1
      rules:
        - strategy: FieldRename
          fieldRename:
            hubPath: spec.name
            spokePath: spec.widgetName
        - strategy: FieldRename
          fieldRename:
            hubPath: spec.capacity
            spokePath: spec.size
