# Composition functions used by every stage. Native Kubernetes objects
# (ConfigMaps) are emitted by function-go-templating; function-auto-ready
# marks the XR Ready once the ConfigMap exists. No provider-kubernetes.
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.12.3
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0
