apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xbuckets.example.org
spec:
  scope: Namespaced
  group: example.org
  names:
    kind: XBucket
    plural: xbuckets
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                storageGB:
                  type: string
                region:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
    - name: v1
      served: true
      referenceable: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                storageSize:
                  type: string
                region:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
