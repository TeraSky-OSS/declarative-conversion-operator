apiVersion: terasky.com/v1alpha1
kind: XRDConversionConfig
metadata:
  name: xbuckets-conversion
spec:
  targetXRD:
    name: xbuckets.example.org
  hubVersion: v2
  # Required for GitOps: XRD and this object reconcile independently.
  # FailClosed would drop conversions during that window.
  driftPolicy: KeepServingStale
  spokes:
    - version: v1
      rules:
        - strategy: FieldRename
          fieldRename:
            hubPath: spec.storageGB
            spokePath: spec.storageSize
