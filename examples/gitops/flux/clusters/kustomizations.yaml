# Apply after Flux is installed. Point spec.url at the repo that contains
# this tree (this file uses the public operator repo as the example).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: declarative-conversion-operator
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/TeraSky-OSS/declarative-conversion-operator
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: conversion-operator
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 10m
  path: ./examples/gitops/flux/operator
  healthChecks:
    - apiVersion: terasky.com/v1alpha1
      kind: ConversionWebhookServer
      name: default
      namespace: declarative-conversion-system
  sourceRef:
    kind: GitRepository
    name: declarative-conversion-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: conversion-configs
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  wait: true
  timeout: 5m
  path: ./examples/gitops/configs
  dependsOn:
    - name: conversion-operator
  sourceRef:
    kind: GitRepository
    name: declarative-conversion-operator
