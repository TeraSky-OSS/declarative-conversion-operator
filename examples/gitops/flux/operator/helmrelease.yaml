apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: declarative-conversion-operator
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: declarative-conversion-system
  storageNamespace: declarative-conversion-system
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: declarative-conversion-operator
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: terasky-oss
        namespace: flux-system
  values:
    features:
      crossplane:
        enabled: true
      nativeCRD:
        enabled: true
