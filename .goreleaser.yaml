version: 2

project_name: declarative-conversion-operator

before:
  hooks:
    - go mod tidy

builds:
  - id: convctl
    main: ./cmd/convctl
    binary: convctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      # commit and date go in too: "convctl says this conversion is lossy"
      # is unactionable in a bug report without knowing which convctl.
      - -s -w
      # .Tag, not .Version: .Version strips the leading v, so the binary
      # reported 0.3.0 for the release everyone calls v0.3.0 — a mismatch
      # every consumer has to know about to compare the two.
      - -X main.version={{ .Tag }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: convctl
    ids: [convctl]
    name_template: >-
      {{ .ProjectName }}-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Linux packages, attached to the release. Installing a kubectl-adjacent
# tool by downloading a tarball is not how the ecosystem works.
nfpms:
  - id: convctl
    ids: [convctl]
    package_name: convctl
    vendor: TeraSky
    homepage: https://terasky-oss.github.io/declarative-conversion-operator/
    maintainer: TeraSky OSS <oss@terasky.com>
    description: |-
      CLI for the declarative conversion operator: validate, analyze and test
      Crossplane XRD and CRD conversion configs offline or against a cluster.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin

# Homebrew. GoReleaser deprecated `brews:` in favour of casks, which are
# macOS-only — so Linuxbrew users install from the deb/rpm above or the
# archive, which is the trade the deprecation forces.
homebrew_casks:
  - name: convctl
    ids: [convctl]
    repository:
      owner: terasky-oss
      name: homebrew-tap
      # index rather than .Env.X: the dotted form errors when the variable
      # is unset, which would fail a release because a tap repository does
      # not exist yet. Unset means skip, below.
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
      branch: main
    homepage: https://terasky-oss.github.io/declarative-conversion-operator/
    description: CLI for the declarative conversion operator
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    # No quarantine-stripping hook. Removing com.apple.quarantine would
    # turn Gatekeeper off for this binary, and a checksum is not a
    # substitute for code signing and notarization: it proves the file is
    # the one the release published, not that anybody vouched for what it
    # does. macOS will warn on first run until these artifacts are notarized,
    # which is the honest state of affairs rather than one papered over
    # during install.

scoops:
  - name: convctl
    ids: [convctl]
    repository:
      owner: terasky-oss
      name: scoop-bucket
      token: '{{ index .Env "SCOOP_BUCKET_TOKEN" }}'
    homepage: https://terasky-oss.github.io/declarative-conversion-operator/
    description: CLI for the declarative conversion operator
    license: Apache-2.0
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'

checksum:
  name_template: "checksums.txt"

sboms:
  # One CycloneDX SBOM per archive (${artifact}.sbom); requires syft on PATH
  # (installed via anchore/sbom-action/download-syft in the release workflow).
  # GoReleaser's own default is spdx-json, so the format is set explicitly.
  - artifacts: archive
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"

signs:
  # Keyless-sign checksums.txt with cosign, using the workflow's GitHub OIDC
  # identity (needs id-token: write and cosign on PATH). Verifying the
  # checksum file's signature and matching an archive's hash against it
  # verifies that archive, so we don't need to sign every archive individually.
  # Signs checksums.txt into a Sigstore bundle — the format cosign v3
  # produces by default. The bundle carries the signature, the Fulcio
  # certificate and the Rekor inclusion proof in one file, so verification
  # needs no Rekor round-trip and there is one asset instead of two.
  #
  # This requires cosign v3 to verify. That is a deliberate floor, not an
  # oversight: cosign v3 verifies BOTH formats with the same command, so
  # nobody verifying earlier releases is affected, and the detached
  # --output-signature/--output-certificate flags are already deprecated
  # and warn on every run. setup-convctl handles both, picking by which
  # assets a release actually has.
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: terasky-oss
    name: declarative-conversion-operator
  # The Docker images and Helm chart are published as separate steps in
  # the release workflow (they don't fit goreleaser's one-binary-per-image
  # model as cleanly as the CLI does); this section covers the CLI
  # binaries, checksums, and changelog only.
  header: |
    ## declarative-conversion-operator {{ .Tag }}

    Container images: `ghcr.io/terasky-oss/declarative-conversion-operator:{{ .Tag }}` and `ghcr.io/terasky-oss/declarative-conversion-webhook-server:{{ .Tag }}`.
    Helm chart: `oci://ghcr.io/terasky-oss/charts/declarative-conversion-operator --version {{ .Version }}`.

    `checksums.txt` below is signed keylessly with [cosign](https://github.com/sigstore/cosign) into a Sigstore bundle (`checksums.txt.bundle`, which needs cosign v3+ to verify) using this workflow's GitHub OIDC identity, and each archive has an accompanying CycloneDX SBOM (`*.sbom`). See the "Signed artifacts" section further down for verification commands and container image/Helm chart digests.
  prerelease: auto
