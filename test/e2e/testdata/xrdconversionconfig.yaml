apiVersion: terasky.com/v1alpha1
kind: XRDConversionConfig
metadata:
  name: xwidgets-e2e-conversion
spec:
  targetXRD:
    name: xwidgets.e2e.example.org
  hubVersion: v2
  spokes:
    - version: v1
      rules:
        - strategy: FieldRename
          fieldRename:
            hubPath: spec.storageGB
            spokePath: spec.storageSize

        - strategy: Delete
          delete:
            path: spec.description
            existsOn: Hub
          acknowledgeLossy: true
          reason: "description is a v2-only field with no v1 equivalent; this e2e fixture deliberately exercises the acknowledged-lossy path against a live cluster, not just offline"
