# A hub-native (v3) composite, used to exercise every v2- and v1-spoke
# strategy's hub->spoke direction when read back at each spoke version —
# see hack/e2e-test.sh. memoryMB is deliberately an exact multiple of 1024
# so the NumericScale assertion (memoryMB / 1024 = memoryGB) is exact
# rather than dependent on rounding behavior.
apiVersion: e2e.example.org/v3
kind: XWidget
metadata:
  name: e2e-widget-v3
  namespace: default
spec:
  storageGB: "500"
  replicaCount: 3
  network:
    cidr: "10.0.0.0/16"
  cpuLimit: "4"
  memoryLimit: "16Gi"
  description: "created via v3"
  size: "Large"
  legacyFlag: true
  primaryRegion:
    name: "us-east-1"
  zones:
    - name: "us-east-1a"
  tags:
    env: "prod"
    team: "platform"
  tier: "gold"
  volumes:
    - sizeGB: "100"
      label: "data"
  priority: 5
  diskSize: "50Gi"
  memoryMB: 4096
  dnsServers:
    - "8.8.8.8"
    - "1.1.1.1"
  contactName: "Jane Doe"
  contactEmail: "jane@example.com"
  endpoints:
    - name: "web"
      url: "https://web.example.com"
  limitsByTier:
    gold:
      limit: "1000"
    silver:
      limit: "500"
  allowedCIDRsCSV: "10.0.0.0/8,192.168.0.0/16"
  cpuRequest: "500m"
  timeout: "5m"
  extraLabels:
    app: "widget"
    region: "us-east-1"
