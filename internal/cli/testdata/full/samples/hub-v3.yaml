apiVersion: example.org/v3
kind: Widget
metadata:
  name: sample-hub
spec:
  storageGB: "500"
  replicaCount: 3
  network:
    cidr: "10.0.0.0/16"
  cpuLimit: "4"
  memoryLimit: "16Gi"
  description: "Production widget cluster in us-east-1"
  size: "Large"
  legacyFlag: true
  primaryRegion:
    name: "us-east-1"
  zones:
    - name: "us-east-1a"
  tags:
    env: "prod"
    team: "platform"
  tier: "gold"
  volumes:
    - sizeGB: "100"
      label: "data"
    - sizeGB: "20"
      label: "logs"
  priority: 5
  diskSize: "50Gi"
  memoryMB: 3000
  dnsServers:
    - "8.8.8.8"
    - "1.1.1.1"
  contactName: "Jane Doe"
  contactEmail: "jane@example.com"
  endpoints:
    - name: "web"
      url: "https://web.example.com"
    - name: "api"
      url: "https://api.example.com"
  limitsByTier:
    gold:
      limit: "1000"
    silver:
      limit: "500"
  allowedCIDRsCSV: "10.0.0.0/8,192.168.0.0/16"
  cpuRequest: "500m"
  timeout: "5m"
  extraLabels:
    app: "widget"
    region: "us-east-1"
  packed: 1025
status:
  phase: "Ready"
  observedGeneration: 5
