apiVersion: terasky.com/v1alpha1
kind: XRDConversionConfig
metadata:
  name: xprios-conversion
spec:
  targetXRD:
    name: xprios.example.org
  hubVersion: v2
  spokes:
    - version: v1
      rules:
        - strategy: TypeCoerce
          typeCoerce:
            path: spec.weight
            onFractionalInteger: Error
