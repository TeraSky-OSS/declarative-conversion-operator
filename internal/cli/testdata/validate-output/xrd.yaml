# Every spoke field is covered by a rule, so the coverage analysis is happy.
# What it cannot see is that the rules produce values v1's own schema
# rejects: spec.region is required but its hub source is optional, and
# spec.tier is an enum the hub does not constrain.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xoutputs.validate.example.org
spec:
  scope: Namespaced
  group: validate.example.org
  names:
    kind: XOutput
    plural: xoutputs
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                tier:
                  type: string
                region:
                  type: string
    - name: v1
      served: true
      referenceable: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - region
              properties:
                size:
                  type: string
                region:
                  type: string
                tier:
                  type: string
                  enum:
                    - gold
                    - silver
