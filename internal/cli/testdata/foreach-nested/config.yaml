apiVersion: terasky.com/v1alpha1
kind: XRDConversionConfig
metadata:
  name: xvolumesets-conversion
spec:
  targetXRD:
    name: xvolumesets.example.org
  hubVersion: v2
  spokes:
    - version: v1
      rules:
        - strategy: ForEach
          forEach:
            hubItemsPath: spec.volumes
            spokeItemsPath: spec.volumes
            rules:
              - strategy: ForEach
                forEach:
                  hubItemsPath: disks
                  spokeItemsPath: disks
                  rules:
                    - strategy: FieldRename
                      fieldRename:
                        hubPath: sizeGB
                        spokePath: size
