apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xvolumesets.example.org
spec:
  scope: Namespaced
  group: example.org
  names:
    kind: XVolumeSet
    plural: xvolumesets
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                volumes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      disks:
                        type: array
                        items:
                          type: object
                          properties:
                            sizeGB:
                              type: string
    - name: v1
      served: true
      referenceable: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                volumes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      disks:
                        type: array
                        items:
                          type: object
                          properties:
                            size:
                              type: string
