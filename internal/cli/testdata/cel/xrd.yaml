apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xpacked.example.org
spec:
  scope: Namespaced
  group: example.org
  names:
    kind: XPacked
    plural: xpacked
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                packed:
                  type: integer
    - name: v1
      served: true
      referenceable: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                bitHigh:
                  type: integer
                bitLow:
                  type: integer
