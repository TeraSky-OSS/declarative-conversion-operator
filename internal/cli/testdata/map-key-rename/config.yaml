apiVersion: terasky.com/v1alpha1
kind: XRDConversionConfig
metadata:
  name: xlabels-conversion
spec:
  targetXRD:
    name: xlabels.example.org
  hubVersion: v2
  spokes:
    - version: v1
      rules:
        - strategy: MapKeyRename
          mapKeyRename:
            hubPath: spec.extraLabels
            spokePath: spec.extraLabels
            renames:
              app: application
