apiVersion: v2
name: declarative-conversion-operator
description: Declarative conversion webhooks for Crossplane XRDs and native Kubernetes CRDs — configure hub/spoke version conversions without hand-writing a webhook.
type: application
version: 0.1.0
appVersion: "0.1.0"
# Matches docs/installation.md prerequisites (Kubernetes 1.27+). Chart templates
# use apps/v1 Deployments, policy/v1 PodDisruptionBudgets, and
# admissionregistration.k8s.io/v1 ValidatingWebhookConfigurations — all stable
# well before 1.27; the floor is the documented operator baseline, not the
# absolute API introduction version.
kubeVersion: ">=1.27.0-0"
home: https://github.com/terasky-oss/declarative-conversion-operator
