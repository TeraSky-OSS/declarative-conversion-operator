{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "declarative-conversion-operator.fullname" . }}-dashboard-conversion-overview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "declarative-conversion-operator.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  conversion-overview.json: |-
{{ .Files.Get "files/dashboards/conversion-overview.json" | indent 4 }}
{{- end }}
