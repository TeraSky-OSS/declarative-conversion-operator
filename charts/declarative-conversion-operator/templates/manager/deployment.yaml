apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "declarative-conversion-operator.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "declarative-conversion-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.manager.replicaCount }}
  selector:
    matchLabels:
      {{- include "declarative-conversion-operator.managerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "declarative-conversion-operator.managerSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "declarative-conversion-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # PSS restricted — kept identical to ConversionWebhookServer pods
      # (see docs/security/pod-security.md). runAsUser unset so custom
      # image USER is honored; runAsNonRoot rejects root.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ include "declarative-conversion-operator.managerImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            {{- if .Values.manager.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --default-webhook-server-image={{ include "declarative-conversion-operator.webhookServerImage" . }}
            - --enable-xrd-support={{ .Values.features.crossplane.enabled }}
            - --enable-crd-support={{ .Values.features.nativeCRD.enabled }}
            {{- with .Values.manager.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.admissionWebhook.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.admissionWebhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "declarative-conversion-operator.fullname" . }}-webhook-cert
        {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
