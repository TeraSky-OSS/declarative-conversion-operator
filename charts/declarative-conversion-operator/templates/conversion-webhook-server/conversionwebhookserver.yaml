{{- if .Values.conversionWebhookServer.create }}
apiVersion: terasky.com/v1alpha1
kind: ConversionWebhookServer
metadata:
  name: {{ .Values.conversionWebhookServer.name }}
  labels:
    {{- include "declarative-conversion-operator.labels" . | nindent 4 }}
spec:
  default: {{ .Values.conversionWebhookServer.default }}
  {{- if .Values.conversionWebhookServer.namespace }}
  namespace: {{ .Values.conversionWebhookServer.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  serviceAccountName: {{ include "declarative-conversion-operator.webhookServerServiceAccountName" . }}
  {{- if .Values.conversionWebhookServer.autoscaling.enabled }}
  autoscaling:
    minReplicas: {{ .Values.conversionWebhookServer.autoscaling.minReplicas }}
    maxReplicas: {{ .Values.conversionWebhookServer.autoscaling.maxReplicas }}
    targetCPUUtilizationPercentage: {{ .Values.conversionWebhookServer.autoscaling.targetCPUUtilizationPercentage }}
  {{- else }}
  replicas: {{ .Values.conversionWebhookServer.replicaCount }}
  {{- end }}
  image:
    repository: {{ .Values.image.registry }}/{{ .Values.image.webhookServer.repository }}
    {{- if .Values.image.webhookServer.digest }}
    digest: {{ .Values.image.webhookServer.digest | quote }}
    {{- else }}
    tag: {{ .Values.image.webhookServer.tag | default .Chart.AppVersion | quote }}
    {{- end }}
    pullPolicy: {{ .Values.image.pullPolicy }}
  resources:
    {{- toYaml .Values.conversionWebhookServer.resources | nindent 4 }}
  service:
    type: {{ .Values.conversionWebhookServer.service.type }}
    port: {{ .Values.conversionWebhookServer.service.port }}
    {{- with .Values.conversionWebhookServer.service.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  certificate:
    duration: {{ .Values.conversionWebhookServer.certificate.duration | quote }}
    renewBefore: {{ .Values.conversionWebhookServer.certificate.renewBefore | quote }}
    issuerRef:
      {{- if .Values.conversionWebhookServer.certificate.issuerRef.name }}
      name: {{ .Values.conversionWebhookServer.certificate.issuerRef.name }}
      kind: {{ .Values.conversionWebhookServer.certificate.issuerRef.kind | default "ClusterIssuer" }}
      {{- else if .Values.certManager.issuerRef.name }}
      name: {{ .Values.certManager.issuerRef.name }}
      kind: {{ .Values.certManager.issuerRef.kind | default "ClusterIssuer" }}
      {{- else }}
      name: {{ include "declarative-conversion-operator.fullname" . }}-selfsigned-issuer
      kind: ClusterIssuer
      {{- end }}
  {{- if .Values.conversionWebhookServer.podDisruptionBudget.enabled }}
  podDisruptionBudget:
    minAvailable: {{ .Values.conversionWebhookServer.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.priorityClassName }}
  priorityClassName: {{ . }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.topologySpreadConstraints }}
  topologySpreadConstraints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.podLabels }}
  podLabels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.podAnnotations }}
  podAnnotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /*
    extraArgs is assembled rather than passed through: maxRequestBytes and
    requestTimeout get first-class values keys (so values.schema.json can
    type them and a typo is rejected) but are ordinary webhook-server flags
    underneath. User-supplied extraArgs come last so an operator can still
    override either one the hard way.
  */}}
  {{- $args := list }}
  {{- with .Values.conversionWebhookServer.maxRequestBytes }}
  {{- $args = append $args (printf "--max-request-bytes=%v" .) }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.requestTimeout }}
  {{- $args = append $args (printf "--request-timeout=%v" .) }}
  {{- end }}
  {{- $args = concat $args (.Values.conversionWebhookServer.extraArgs | default list) }}
  {{- with $args }}
  extraArgs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.extraEnv }}
  extraEnv:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.extraVolumes }}
  extraVolumes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.conversionWebhookServer.extraVolumeMounts }}
  extraVolumeMounts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $cs := .Values.conversionWebhookServer.cacheSelector | default dict }}
  {{- if or $cs.matchLabels $cs.matchExpressions }}
  cacheSelector:
    {{- toYaml $cs | nindent 4 }}
  {{- end }}
{{- end }}
