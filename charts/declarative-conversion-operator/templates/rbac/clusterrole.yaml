{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "declarative-conversion-operator.fullname" . }}-manager-role
  labels:
    {{- include "declarative-conversion-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- /*
    get only. The manager reads one key out of one Secret per
    ConversionWebhookServer through an uncached client and never lists or
    watches them, so list/watch would be dormant privilege over every Secret
    in the cluster -- and granting them back would also re-enable the
    cluster-wide Secret informer that was deliberately removed.
  */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  {{- /*
    The highest-privilege grants this operator holds — patching somebody
    else's CompositeResourceDefinitions and CustomResourceDefinitions — are
    conditioned on the feature that needs them, so a disabled feature leaves
    no dormant privilege behind.

    Read and write are gated separately for CustomResourceDefinition, and the
    asymmetry is load-bearing. Reading them is required whenever EITHER
    feature is on: an XRDConversionConfig's ConversionPropagated condition is
    computed by reading the CRD Crossplane *generated* from the XRD, which has
    nothing to do with native-CRD support. Only the patch verb is
    native-CRD-only. Gating the read on nativeCRD as well takes the manager's
    CRD informer down with a permission error on a Crossplane-only install.
  */}}
  {{- if .Values.features.crossplane.enabled }}
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["compositeresourcedefinitions"]
    verbs: ["get", "list", "patch", "watch"]
  {{- end }}
  {{- if or .Values.features.crossplane.enabled .Values.features.nativeCRD.enabled }}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    {{- if .Values.features.nativeCRD.enabled }}
    verbs: ["get", "list", "patch", "watch"]
    {{- else }}
    verbs: ["get", "list", "watch"]
    {{- end }}
  {{- end }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["terasky.com"]
    resources: ["conversionwebhookservers", "crdconversionconfigs", "xrdconversionconfigs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["terasky.com"]
    resources: ["conversionwebhookservers/finalizers", "crdconversionconfigs/finalizers", "xrdconversionconfigs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["terasky.com"]
    resources: ["conversionwebhookservers/status", "crdconversionconfigs/status", "xrdconversionconfigs/status"]
    verbs: ["get", "patch", "update"]
---
# RBAC for cmd/webhook-server pods. Deliberately minimal: each replica runs
# its own controller-runtime informers directly against the API server so
# it can compile its own in-memory registry without depending on the
# operator manager at request time.
#
# Cluster-wide, this is read-only — the webhook-server never mutates an
# XRD, a CRD, or a conversion config. The one thing it does write is its
# own served-target Lease, and that grant is a namespaced Role (below)
# rather than part of this ClusterRole, so a webhook-server pod cannot
# touch a Lease anywhere else in the cluster. Leases are how leader
# election is implemented across the ecosystem; cluster-wide write on them
# is not a grant to hand out for a bookkeeping annotation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "declarative-conversion-operator.fullname" . }}-webhook-server-role
  labels:
    {{- include "declarative-conversion-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["terasky.com"]
    resources: ["xrdconversionconfigs", "crdconversionconfigs", "conversionwebhookservers"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.features.crossplane.enabled }}
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["compositeresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.features.nativeCRD.enabled }}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
# The one write a webhook-server replica makes: its own served-target
# Lease, which is what lets the operator verify an instance can already
# serve a target before moving that target onto it. Namespaced, and only in
# the release namespace.
#
# A ConversionWebhookServer whose spec.namespace points somewhere else
# needs the same Role and RoleBinding created there. Without it the
# replicas still serve conversions perfectly well; what is lost is the
# verified handover, and the config reports HandoverReady with reason
# HandoverUnverified rather than failing.
#
# No list or watch: a replica reads back exactly one Lease, by name, and
# giving it the ability to enumerate the namespace's Leases would hand it
# every leader-election holder identity for nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "declarative-conversion-operator.fullname" . }}-webhook-server-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "declarative-conversion-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "declarative-conversion-operator.fullname" . }}-webhook-server-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "declarative-conversion-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "declarative-conversion-operator.fullname" . }}-webhook-server-leases
subjects:
  - kind: ServiceAccount
    name: {{ include "declarative-conversion-operator.webhookServerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
