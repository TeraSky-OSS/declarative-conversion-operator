nameOverride: ""
fullnameOverride: ""
# Labels merged onto every chart-templated resource (not CWS child pods;
# those are owned by the ConversionWebhookServer controller). Keys the
# chart uses for identity or the manager Deployment selector
# (app.kubernetes.io/name, instance, managed-by, version, helm.sh/chart,
# control-plane) are ignored so they cannot break rolling updates.
commonLabels: {}
imagePullSecrets: []

image:
  registry: ghcr.io
  manager:
    repository: terasky-oss/declarative-conversion-operator
    tag: ""
    # Optional content digest (e.g. sha256:...). When set, pins the image by
    # digest instead of tag (repository@digest).
    digest: ""
  webhookServer:
    repository: terasky-oss/declarative-conversion-webhook-server
    tag: ""
    digest: ""
  pullPolicy: IfNotPresent

# CRDs are installed from the crds/ directory (Helm's built-in convention):
# applied once at `helm install`, never touched by `helm upgrade` or
# `helm uninstall`. This is the safest default for a CRD-heavy chart — no
# accidental data loss from a schema change — at the cost of requiring a
# manual CRD apply whenever the schema changes across an upgrade.
# Use `make helm-upgrade-crds` (or hack/upgrade-crds.sh) to diff/apply;
# see NOTES.txt and docs/operations/upgrade-runbook.md.
crds:
  install: true

# Both CRDs (XRDConversionConfig, CRDConversionConfig) are always installed
# from crds/ above regardless of these toggles — Helm's crds/ directory
# doesn't support conditionals, and an unused CRD sitting inert is
# harmless. These toggles instead control which controllers/watches the
# manager and every webhook-server replica actually set up.
features:
  # Crossplane 2.x must already be installed for this to be safe: the
  # manager watches Crossplane's CompositeResourceDefinition GVK at
  # apiextensions.crossplane.io/v2, which a Crossplane 1.x control plane
  # does not serve at all. With this enabled the manager checks for that
  # API version at startup and exits with an actionable error if it is
  # absent. Disable on clusters without Crossplane 2.x.
  #
  # scope: LegacyCluster XRDs (the v1 compatibility layer inside
  # Crossplane 2.x — claims and connection secrets included) are fully
  # supported; "2.x only" is about the control plane, not claims.
  crossplane:
    enabled: true
    # A mutating admission webhook on compositeresourcedefinitions that
    # re-injects spec.conversion into any write that would drop it.
    #
    # It exists because Crossplane's package establisher writes established
    # objects with a full client.Update from the package contents rather
    # than a Server-Side Apply, and re-runs on every ConfigurationRevision
    # reconcile — which the default one-hour --sync guarantees. So an XRD
    # shipped in a Configuration loses spec.conversion roughly hourly. The
    # operator re-applies within seconds, but during that window the
    # generated CRD is back on strategy: None and the apiserver serves
    # stored objects relabelled but UNCONVERTED, with HTTP 200 and no
    # error.
    #
    # failurePolicy is Ignore, always: a guard that could block XRD writes
    # would make package installs depend on this operator's availability.
    # Fail open, and let the controller re-apply as the backstop — normal
    # operation has no window, degraded operation is exactly the behaviour
    # without the guard.
    #
    # Both upstream write paths carry a TODO to move to Server-Side Apply.
    # Once a Crossplane version lands that no longer needs this, turn it
    # off; nothing else changes.
    conversionGuard:
      enabled: true
  # Native CRD conversion support (CRDConversionConfig) watches a core
  # Kubernetes type that's always present, so this carries no equivalent
  # startup risk — disable only if you simply don't want the feature
  # active.
  nativeCRD:
    enabled: true

manager:
  replicaCount: 1
  leaderElection:
    enabled: true
  # How many objects each controller reconciles at once. The shipped
  # dashboard's "Controller health" row plots workqueue depth, which is the
  # leading indicator of a backlog; raise this when depth is persistently
  # non-zero and the apiserver has the QPS headroom. A given object is
  # never reconciled by two workers at once regardless of this value.
  maxConcurrentReconciles: 1
  image: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  extraArgs: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  # Extra labels on manager pods. Selector/identity keys are ignored
  # (same restriction as commonLabels).
  podLabels: {}
  podAnnotations: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

rbac:
  create: true
serviceAccount:
  create: true
  name: ""
  webhookServerName: ""
  annotations: {}

# Surface #1: this operator's OWN admission webhook validating
# XRDConversionConfig/ConversionWebhookServer objects themselves at
# kubectl-apply time. Served by the manager. Distinct from the
# conversion-webhook-server surface below, which serves per-XRD CRD
# conversion requests.
admissionWebhook:
  enabled: true
  failurePolicy: Fail
  certificate:
    issuerRef: {}
    duration: 8760h
    renewBefore: 720h

# cert-manager is a required external prerequisite for both webhook
# surfaces. If issuerRef is left empty, the chart creates a bootstrap
# self-signed ClusterIssuer so `helm install` works zero-config once
# cert-manager itself is installed; production users should override this
# with a real CA-backed Issuer/ClusterIssuer.
certManager:
  issuerRef:
    name: ""
    kind: ClusterIssuer
  selfSigned:
    enabled: true

# Surface #2: the default ConversionWebhookServer instance. The chart
# templates exactly ONE ConversionWebhookServer custom resource (never a
# raw Deployment/Service/HPA/PDB directly) — the operator's own controller
# reconciles that CR into the real child resources, so templating them here
# too would fight the controller's reconciliation loop. Keys below are
# passed through to that CR. Create additional instances directly as
# ConversionWebhookServer CRs for scale-out/tenancy — see
# docs/configuration/conversionwebhookserver.md.
conversionWebhookServer:
  create: true
  name: default
  default: true
  namespace: ""
  replicaCount: 2
  # Maximum ConversionReview request body the webhook-server will read.
  # A larger body is answered with a ConversionReview failure naming this
  # limit, rather than being buffered. Raise it only if legitimate batches
  # are being rejected — this is what stops one client from exhausting the
  # process on the apiserver's write path. A positive integer, or the empty
  # string to use the binary's own default (32 MiB). Zero, negative and
  # non-numeric values are rejected at install: the webhook-server refuses
  # them at startup, and a crash loop is a poor way to learn that.
  maxRequestBytes: ""
  # Maximum time one ConversionReview may occupy a worker. Must stay below
  # the write timeout (35s) so the failure is delivered rather than
  # truncated. A positive Go duration, or the empty string to use the
  # binary's own default (30s). Zero durations are rejected at install.
  requestTimeout: ""
  extraArgs: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podLabels: {}
  podAnnotations: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  cacheSelector: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # How a replica leaves service. These four values are one set — see the
  # RolloutSpec docs (`kubectl explain conversionwebhookserver.spec.rollout`)
  # and docs/operations/ha-checklist.md. Leave a key null to take the CRD's
  # default, which is what makes a rollout cause zero failed conversions:
  #   preStopSleepSeconds 5, terminationGracePeriodSeconds 45,
  #   maxUnavailable 0, maxSurge 1, defaultTopologySpread true.
  rollout:
    preStopSleepSeconds: null
    terminationGracePeriodSeconds: null
    maxUnavailable: null
    maxSurge: null
    defaultTopologySpread: null
  # How long a replica may take to compile every assigned plan before the
  # kubelet gives up on it. The probe polls /readyz, which stays false
  # until the initial sync completes, so periodSeconds x failureThreshold
  # is a deadline on the sync itself; the CRD's defaults give five minutes.
  # Without it a replica wedged mid-sync would stay liveness-healthy and
  # never ready, out of the Service and never restarted. See
  # docs/operations/capacity.md for the measured cold start this is sized
  # against. Leave a key null to take the CRD's default.
  startupProbe:
    enabled: null
    periodSeconds: null
    failureThreshold: null
  # Automatic assignment. Off unless you set it. When any instance opts
  # in, the pool of opted-in instances — not spec.default — is what serves
  # configs with no explicit webhookServerRef, distributed by rendezvous
  # hashing on the target name. The instance marked default must be a pool
  # member while a pool exists, which admission enforces, so enable this
  # on the chart's own default instance FIRST and on additional instances
  # afterwards. See docs/configuration/conversionwebhookserver.md.
  sharding:
    enabled: null
    weight: null
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  certificate:
    issuerRef: {}
    duration: 2160h
    renewBefore: 360h
  service:
    type: ClusterIP
    port: 443
    annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

metrics:
  enabled: true
  serviceMonitor:
    # Opt-in by value, not auto-detected: `.Capabilities` presence-checks
    # silently no-op under `helm template` / offline GitOps rendering, so a
    # chart that behaved differently depending on how it's rendered would
    # be a worse default than a plain, explicit opt-in.
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # How long "applied to the XRD but never observed in the generated
    # CRD" has to hold before ConversionAppliedButNotPropagated fires.
    # Crossplane normally re-renders in seconds; this is the budget for
    # "Crossplane is wedged, paused, or has lost RBAC", so it should be
    # comfortably longer than a healthy re-render and shorter than anyone's
    # patience with silently-unconverted reads.
    propagationLagFor: 5m
    # Workqueue depth is the leading indicator of a reconcile backlog: it
    # rises before phases go stale and before ConversionPropagated lags. A
    # healthy controller drains its queue between bursts, so the alert is
    # about a depth that STAYS up — tune the threshold to your fleet size
    # (a bulk apply of two hundred configs legitimately spikes it) and the
    # duration to how long a backlog may last before it is a problem.
    workqueueDepthThreshold: 10
    workqueueBacklogFor: 15m
    # Reconciles returning an error, per second, sustained for 15m. Counts
    # infrastructure failures as well as config ones, so it is noisier than
    # dco_manager_analyze_failures_total and set above zero on purpose.
    reconcileErrorRateThreshold: 0.1

# Grafana sidecar ConfigMaps (label grafana_dashboard: "1") for every JSON
# file under files/dashboards/ (overview, per-target detail, platform
# stability). Independent of ServiceMonitor — you still need scrapes for
# panels to populate. Resource panels on the stability dashboard also need
# kubelet cAdvisor + kube-state-metrics.
dashboards:
  enabled: false
  labels: {}

# Opt-in NetworkPolicies for manager + default ConversionWebhookServer pods.
# Off by default so existing installs see no behavior change. When enabled,
# non-webhook/non-probe ingress is denied; see docs/security/metrics.md.
networkPolicy:
  enabled: false
  metrics:
    # List of networking.k8s.io NetworkPolicyPeer objects allowed to scrape
    # the *manager* metrics port (8080). Empty = any source may scrape.
    # Does not apply to CWS port 8443 (probes share that port). Webhook
    # ports remain open to the apiserver either way.
    # Example:
    #   allowedPeers:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: monitoring
    #       podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: prometheus
    allowedPeers: []
