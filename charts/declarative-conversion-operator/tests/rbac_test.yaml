suite: RBAC follows the feature toggles
# The ClusterRole's most consequential grant is patch on
# compositeresourcedefinitions — the operator mutating somebody else's type.
# It should not be there on a cluster that has told the chart there is no
# Crossplane.
templates:
  - rbac/clusterrole.yaml

tests:
  - it: grants XRD patch when Crossplane support is on
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apiextensions.crossplane.io"]
            resources: ["compositeresourcedefinitions"]
            verbs: ["get", "list", "patch", "watch"]
          any: true
        documentIndex: 0

  - it: does not grant XRD access when Crossplane support is off
    set:
      features.crossplane.enabled: false
    asserts:
      - notMatchRegex:
          path: rules[*].apiGroups[*]
          pattern: apiextensions.crossplane.io

  # Read and write on CustomResourceDefinition are gated differently, and the
  # difference is the one an e2e caught: an XRDConversionConfig's
  # ConversionPropagated condition is computed by reading the CRD Crossplane
  # *generated* from the XRD, so the manager needs CRD reads whenever either
  # feature is on. Gating the read on nativeCRD took the CRD informer down
  # with a permission error on every Crossplane-only install.
  - it: keeps CRD reads but drops CRD patch when native CRD support is off
    set:
      features.nativeCRD.enabled: false
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list", "watch"]
          any: true
      - notContains:
          path: rules
          content:
            apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list", "patch", "watch"]

  - it: drops CRD access entirely only when both features are off
    set:
      features.nativeCRD.enabled: false
      features.crossplane.enabled: false
    asserts:
      - notMatchRegex:
          path: rules[*].apiGroups[*]
          pattern: apiextensions

  - it: renders nothing when rbac.create is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  # The one write a webhook-server pod makes has to stay namespaced. A
  # cluster-wide leases grant would let a conversion pod overwrite any
  # leader-election Lease in the cluster, which is not a trade worth making
  # for a bookkeeping annotation.
  - it: grants webhook-server Lease access through a namespaced Role only
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Role
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentIndex: 2
      - equal:
          path: rules
          value:
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "create", "update", "patch"]
        documentIndex: 2
      # The webhook-server ClusterRole must stay free of it.
      - notMatchRegex:
          path: rules[*].apiGroups[*]
          pattern: coordination.k8s.io
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 3
