{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "xrd-conversion-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "xrd-conversion-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "xrd-conversion-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "xrd-conversion-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "xrd-conversion-operator.fullname" . }}-webhook-server-rolebinding
  labels:
    {{- include "xrd-conversion-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "xrd-conversion-operator.fullname" . }}-webhook-server-role
subjects:
  - kind: ServiceAccount
    name: {{ include "xrd-conversion-operator.webhookServerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
