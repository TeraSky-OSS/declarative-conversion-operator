{{- if .Values.admissionWebhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xrd-conversion-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xrd-conversion-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "xrd-conversion-operator.managerSelectorLabels" . | nindent 4 }}
  ports:
    - port: 443
      targetPort: webhook-server
{{- end }}
