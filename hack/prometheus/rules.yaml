# Static copy of charts/.../templates/monitoring/prometheusrule.yaml expressions
# for promtool unit tests. Keep in sync when changing alert PromQL.
groups:
  - name: declarative-conversion-operator
    rules:
      - alert: ConversionWebhookRegistryCompileErrors
        expr: increase(dco_webhook_registry_compile_errors_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ConversionWebhookServer replica failing to (re)compile plan for {{ $labels.target }}"
          description: "Check the corresponding XRDConversionConfig/CRDConversionConfig status and the replica's /debug/registry endpoint."
      - alert: ConversionWebhookNotReady
        expr: (max(dco_webhook_ready) or on() vector(0)) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No ConversionWebhookServer replica is ready"
          description: "Every scraped webhook-server replica reports dco_webhook_ready=0 (or no series exist). Conversion traffic cannot be served."
      - alert: ConversionWebhookHighLatency
        expr: histogram_quantile(0.99, sum(rate(dco_webhook_conversion_review_duration_seconds_bucket[5m])) by (le, target)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 ConversionReview latency exceeds 1s for {{ $labels.target }}"
          description: "The conversion webhook is on the API admission critical path; sustained high latency slows apiserver requests for the affected target."
      - alert: ConversionWebhookPanics
        expr: |
          (
            increase(dco_webhook_conversion_panics_total[15m]) > 0
          )
          or
          (
            dco_webhook_conversion_panics_total > 0
            unless
            dco_webhook_conversion_panics_total offset 15m
          )
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "The conversion webhook panicked while converting {{ $labels.target }}"
          description: "A recovered panic is always a bug in declarative-conversion-operator, and every request that hits it fails a write on the apiserver's admission path. The pod log carries the stack trace. No `for:` delay: one panic is already worth waking up for."
      - alert: ConversionWebhookLossyRate
        expr: sum by (target, direction) (rate(dco_webhook_lossy_conversion_total[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Acknowledged-lossy conversion rate elevated for {{ $labels.target }}"
          description: "Known-lossy conversion paths are firing above threshold (direction={{ $labels.direction }}). Unexpected if clients are not intentionally converting in a lossy direction."
      - alert: ConversionWebhookErrorRatio
        expr: |
          (
            sum by (target) (rate(dco_webhook_conversion_review_requests_total{result="error"}[5m]))
            /
            clamp_min(sum by (target) (rate(dco_webhook_conversion_review_requests_total[5m])), 1e-9)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Conversion error ratio >5% for {{ $labels.target }}"
          description: "More than 5% of ConversionReview requests for this target are failing with result=error."
      - alert: ManagerReconcileAnalyzeFailures
        expr: increase(dco_manager_analyze_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Manager analyze/compile failures for {{ $labels.target }}"
          description: "config_kind={{ $labels.config_kind }} reason={{ $labels.reason }}. Check the config status conditions and recent manager logs."
      - alert: ConversionAppliedButNotPropagated
        expr: dco_manager_conversion_propagated == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conversion applied to XRD {{ $labels.target }} but never observed in the generated CRD"
          description: "The operator patched spec.conversion onto the XRD, but Crossplane has not re-rendered {{ $labels.target }}'s generated CRD with that webhook block. Until it does, the generated CRD falls back to strategy: None and the apiserver serves stored objects relabelled but UNCONVERTED, with HTTP 200 and no error. Check the config's ConversionPropagated condition and status.generatedCRDs, then check whether Crossplane is running, healthy, and not paused on this XRD."
      - alert: ConversionRevertedOutOfBand
        expr: increase(dco_manager_conversion_reverts_total[1h]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Conversion stanza on {{ $labels.target }} was removed out of band"
          description: "config_kind={{ $labels.config_kind }}. A previously-applied spec.conversion was found missing from the target. On an XRD owned by a Crossplane ConfigurationRevision this is the package establisher's non-SSA client.Update stripping it on every revision reconcile (default --sync is one hour); the operator re-applies within seconds, but reads during that window return stored objects relabelled and unconverted, with no error. Check the config's PackageManaged condition and enable the XRD conversion guard to close the window."
      - alert: ManagerPhaseStaleOrFailClosed
        expr: increase(dco_manager_phase_transitions_total{to_phase=~"Stale|Failed"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Config {{ $labels.target }} phase transitioned to {{ $labels.to_phase }}"
          description: "config_kind={{ $labels.config_kind }} from={{ $labels.from_phase }} reason={{ $labels.reason }}. Stale means KeepServingStale after drift; Failed usually means FailClosed revert."
      - alert: ControllerWorkqueueBacklog
        expr: sum by (job, controller) (workqueue_depth) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Reconcile backlog on controller {{ $labels.controller }}"
          description: "job={{ $labels.job }}. This controller's workqueue has stayed above the backlog threshold, so config changes are converging slowly or not at all — expect stale phases and a lagging ConversionPropagated to follow. Check reconcile latency and error rate on the same dashboard row, then raise --max-concurrent-reconciles if the apiserver has the headroom."
      - alert: ControllerReconcileErrors
        expr: sum by (job, controller) (rate(controller_runtime_reconcile_errors_total[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sustained reconcile errors on controller {{ $labels.controller }}"
          description: "job={{ $labels.job }}. Reconciles are returning errors faster than the threshold and being retried with backoff, which both delays convergence and feeds the workqueue depth. Unlike dco_manager_analyze_failures_total this counts infrastructure failures too — a lost API connection, a rejected write — so check the controller's logs rather than the config's status first."
      - alert: ConversionWebhookReplicaNotReady
        expr: dco_webhook_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A conversion webhook server replica has not become ready"
          description: "This replica's registry never completed its initial sync; it is not serving conversion traffic."
