# Static copy of charts/.../templates/monitoring/prometheusrule.yaml expressions
# for promtool unit tests. Keep in sync when changing alert PromQL.
groups:
  - name: declarative-conversion-operator
    rules:
      - alert: ConversionWebhookRegistryCompileErrors
        expr: increase(dco_webhook_registry_compile_errors_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ConversionWebhookServer replica failing to (re)compile plan for {{ $labels.target }}"
          description: "Check the corresponding XRDConversionConfig/CRDConversionConfig status and the replica's /debug/registry endpoint."
      - alert: ConversionWebhookNotReady
        expr: (max(dco_webhook_ready) or on() vector(0)) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No ConversionWebhookServer replica is ready"
          description: "Every scraped webhook-server replica reports dco_webhook_ready=0 (or no series exist). Conversion traffic cannot be served."
      - alert: ConversionWebhookHighLatency
        expr: histogram_quantile(0.99, sum(rate(dco_webhook_conversion_review_duration_seconds_bucket[5m])) by (le, target)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 ConversionReview latency exceeds 1s for {{ $labels.target }}"
          description: "The conversion webhook is on the API admission critical path; sustained high latency slows apiserver requests for the affected target."
      - alert: ConversionWebhookLossyRate
        expr: sum by (target, direction) (rate(dco_webhook_lossy_conversion_total[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Acknowledged-lossy conversion rate elevated for {{ $labels.target }}"
          description: "Known-lossy conversion paths are firing above threshold (direction={{ $labels.direction }}). Unexpected if clients are not intentionally converting in a lossy direction."
      - alert: ConversionWebhookErrorRatio
        expr: |
          (
            sum by (target) (rate(dco_webhook_conversion_review_requests_total{result="error"}[5m]))
            /
            clamp_min(sum by (target) (rate(dco_webhook_conversion_review_requests_total[5m])), 1e-9)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Conversion error ratio >5% for {{ $labels.target }}"
          description: "More than 5% of ConversionReview requests for this target are failing with result=error."
      - alert: ManagerReconcileAnalyzeFailures
        expr: increase(dco_manager_analyze_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Manager analyze/compile failures for {{ $labels.target }}"
          description: "config_kind={{ $labels.config_kind }} reason={{ $labels.reason }}. Check the config status conditions and recent manager logs."
      - alert: ManagerPhaseStaleOrFailClosed
        expr: increase(dco_manager_phase_transitions_total{to_phase=~"Stale|Failed"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Config {{ $labels.target }} phase transitioned to {{ $labels.to_phase }}"
          description: "config_kind={{ $labels.config_kind }} from={{ $labels.from_phase }} reason={{ $labels.reason }}. Stale means KeepServingStale after drift; Failed usually means FailClosed revert."
      - alert: ConversionWebhookReplicaNotReady
        expr: dco_webhook_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A conversion webhook server replica has not become ready"
          description: "This replica's registry never completed its initial sync; it is not serving conversion traffic."
