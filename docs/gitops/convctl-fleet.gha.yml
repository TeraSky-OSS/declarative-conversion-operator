# Reference GitHub Actions workflow — copy into a platform repo.
# This file is not wired into this operator's own CI.
#
# Everything here runs as written. The only things to change are the
# `context` matrix, the paths, and the kubeconfig secret.
name: convctl fleet

on:
  pull_request:
    paths:
      - "**/xrdconversionconfig.yaml"
      - "**/crdconversionconfig.yaml"
      - ".github/workflows/convctl-fleet.yml"

permissions:
  contents: read
  pull-requests: write # for the sticky diff comment

jobs:
  # The fast, offline check. No cluster, no credentials — so it runs on
  # every commit and tells you about an unpaired or broken config before any
  # of the slow jobs start.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: terasky-oss/declarative-conversion-operator/.github/actions/setup-convctl@v1
      - run: convctl lint ./apis/ --output github

  # One leg per cluster. fail-fast: false is required — a red cluster must
  # not hide the others.
  per-cluster:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        context: [prod-us, prod-eu]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Once per job. The Actions below consume convctl from PATH rather
      # than each installing their own.
      - uses: terasky-oss/declarative-conversion-operator/.github/actions/setup-convctl@v1

      # The delta, as a sticky comment per cluster. Exit 1 (deltas found) is
      # a review artifact and does not fail the job; exit 2 (cannot reach the
      # cluster) does.
      - uses: terasky-oss/declarative-conversion-operator/.github/actions/convctl-diff@v1
        with:
          config: apis/widgets/conversion.yaml
          xrd: apis/widgets/xrd.yaml
          live: "true"
          context: ${{ matrix.context }}
          kubeconfig: ${{ secrets.FLEET_KUBECONFIG }}
          comment-tag: diff-${{ matrix.context }}

      - uses: terasky-oss/declarative-conversion-operator/.github/actions/convctl-test@v1
        if: always()
        with:
          config: apis/widgets/conversion.yaml
          xrd: apis/widgets/xrd.yaml
          live: "true"
          context: ${{ matrix.context }}
          kubeconfig: ${{ secrets.FLEET_KUBECONFIG }}
          validate-output: "true"
          artifact-name: convctl-${{ matrix.context }}
          # On a large cluster, bound the run and let the report say it
          # sampled rather than quietly OOMing.
          max-samples: "500"
          sample-strategy: random

  # Or, instead of the matrix: one job that tests every context and emits a
  # single aggregated report with one suite per cluster.
  aggregated:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: terasky-oss/declarative-conversion-operator/.github/actions/setup-convctl@v1
      - uses: terasky-oss/declarative-conversion-operator/.github/actions/convctl-fleet@v1
        with:
          config: apis/widgets/conversion.yaml
          xrd: apis/widgets/xrd.yaml
          contexts: prod-us,prod-eu
          kubeconfig: ${{ secrets.FLEET_KUBECONFIG }}
          validate-output: "true"
